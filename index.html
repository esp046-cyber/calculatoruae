<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AED ⇄ PHP</title>
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<meta name="description" content="Running-total calculator with live UAE Dirham to Philippine Peso rates. Fee-aware and works offline.">
<link rel="canonical" href="https://esp046-cyber.github.io/calculatoruae/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AED ⇄ PHP Calculator">
<meta property="og:title" content="AED ⇄ PHP Calculator">
<meta property="og:description" content="Running-total calculator with live Dirham to Peso rates. Fee-aware, works offline.">
<meta property="og:url" content="https://esp046-cyber.github.io/calculatoruae/">
<meta property="og:image" content="https://esp046-cyber.github.io/calculatoruae/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AED to PHP calculator showing 571 AED converted to 9,734 PHP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AED ⇄ PHP Calculator">
<meta name="twitter:description" content="Running-total calculator with live Dirham to Peso rates.">
<meta name="twitter:image" content="https://esp046-cyber.github.io/calculatoruae/og-image.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AED ⇄ PHP">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <header>
    <button id="swap" class="chip" aria-label="Swap direction"><span id="fromLbl">AED</span> → <span id="toLbl">PHP</span></button>
    <span class="hb"><button id="shareBtn" class="chip">Share</button><button id="histBtn" class="chip">History</button></span>
  </header>

  <section class="display" id="display">
    <div id="expr" class="expr">0</div>
    <div class="row"><span id="baseTotal" class="base">0</span><span id="baseCur" class="cur">AED</span></div>
    <button class="row main copy" id="copy" aria-label="Copy converted total"><span id="convTotal" class="conv">0</span><span id="convCur" class="cur">PHP</span></button>
    <button id="status" class="status">Loading rate…</button>

    <div id="sheet" class="overlay" hidden>
      <div class="ttl"><span>Rate &amp; fee</span><button id="done" class="chip pri">Done</button></div>
      <button class="fld" data-f="ov"><span>Rate (PHP per 1 AED)</span><b id="fRate"></b></button>
      <button class="fld" data-f="fee"><span id="feeLbl">Fee deducted (AED)</span><b id="fFee"></b></button>
      <div class="presets" id="presets"><button class="chip" data-fee="">No fee</button><button class="chip" data-fee="10">10</button><button class="chip" data-fee="15">15</button><button class="chip" data-fee="20">20</button></div>
      <button class="fld" id="mode"><span>Mode</span><b id="fMode"></b></button>
      <div class="acts"><button id="auto" class="chip">Use live rate</button></div>
    </div>
    <div id="hist" class="overlay" hidden>
      <div class="ttl">Last 10 calculations <button id="clearHist" class="lnk">Clear</button></div>
      <div id="histList" class="hlist"></div>
    </div>
  </section>

  <section class="pad" id="pad">
    <button class="k fn" data-k="C">C</button>
    <button class="k fn" data-k="⌫" aria-label="Backspace">⌫</button>
    <button class="k op" data-k="÷">÷</button>
    <button class="k op" data-k="×">×</button>
    <button class="k" data-k="7">7</button>
    <button class="k" data-k="8">8</button>
    <button class="k" data-k="9">9</button>
    <button class="k op" data-k="−">−</button>
    <button class="k" data-k="4">4</button>
    <button class="k" data-k="5">5</button>
    <button class="k" data-k="6">6</button>
    <button class="k op" data-k="+">+</button>
    <button class="k" data-k="1">1</button>
    <button class="k" data-k="2">2</button>
    <button class="k" data-k="3">3</button>
    <button class="k eq tall" data-k="=">=</button>
    <button class="k" data-k="0">0</button>
    <button class="k" data-k=".">.</button>
    <button class="k fn" data-k="%">%</button>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
