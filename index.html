<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AED ⇄ PHP</title>
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <header>
    <button id="swap" class="chip" aria-label="Swap direction"><span id="fromLbl">AED</span> → <span id="toLbl">PHP</span></button>
    <label class="ov">Override rate
      <input id="ov" inputmode="decimal" placeholder="auto" autocomplete="off">
    </label>
  </header>

  <section class="display" aria-live="polite">
    <div id="expr" class="expr">0</div>
    <div class="row"><span id="baseTotal" class="base">0</span><span id="baseCur" class="cur">AED</span></div>
    <div class="row main"><span id="convTotal" class="conv">0</span><span id="convCur" class="cur">PHP</span></div>
    <div id="status" class="status">Loading rate…</div>
  </section>

  <section class="pad" id="pad">
    <button class="k fn" data-k="C">C</button>
    <button class="k fn" data-k="⌫" aria-label="Backspace">⌫</button>
    <button class="k op" data-k="÷">÷</button>
    <button class="k op" data-k="×">×</button>
    <button class="k" data-k="7">7</button>
    <button class="k" data-k="8">8</button>
    <button class="k" data-k="9">9</button>
    <button class="k op" data-k="−">−</button>
    <button class="k" data-k="4">4</button>
    <button class="k" data-k="5">5</button>
    <button class="k" data-k="6">6</button>
    <button class="k op" data-k="+">+</button>
    <button class="k" data-k="1">1</button>
    <button class="k" data-k="2">2</button>
    <button class="k" data-k="3">3</button>
    <button class="k eq tall" data-k="=">=</button>
    <button class="k wide" data-k="0">0</button>
    <button class="k" data-k=".">.</button>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
